services:
  # Nous Hermes Agent gateway. Port 8642 remains private to the Compose network;
  # authenticated users enter through AlpaTrade's existing /app chat route.
  hermes:
    image: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-v2026.7.7.2}
    command: ["gateway", "run"]
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY}
      - API_SERVER_MODEL_NAME=${HERMES_API_MODEL:-hermes-agent}
      # Gateway chat cannot render Hermes's interactive terminal approval modal.
      # This container is isolated and receives no DB, Alpaca, JWT, or general
      # API credentials; the only enabled execution use is the scoped broker curl.
      - HERMES_EXEC_ASK=false
      - HERMES_MAX_ITERATIONS=${HERMES_MAX_ITERATIONS:-20}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Dedicated broker credentials only. Never add DATABASE_URL, broker keys,
      # JWT_SECRET, or AlpaTrade's general API service key to this container.
      - ALPATRADE_API_URL=http://api:5001
      - ALPATRADE_HERMES_API_KEY=${HERMES_API_SERVER_KEY}
    volumes:
      - hermes-data:/opt/data
      - ./hermes/skills/alpatrade:/opt/data/skills/alpatrade:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8642/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "9001:5001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-3}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-2}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-5}
      - DB_APPLICATION_NAME=alpatrade-api
      - ALPACA_PAPER_API_KEY=${ALPACA_PAPER_API_KEY}
      - ALPACA_PAPER_SECRET_KEY=${ALPACA_PAPER_SECRET_KEY}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-yfinance}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - EODHD_API_KEY=${EODHD_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - API_SERVICE_KEY=${API_SERVICE_KEY:-}
      - API_SERVICE_KEYS=${API_SERVICE_KEYS:-}
      - ALPATRADE_HERMES_API_KEY=${HERMES_API_SERVER_KEY:-}
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY:-}
      - TO_EMAIL=${TO_EMAIL:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Durable executor for scoped Hermes backtest and paper jobs. This is an
  # AlpaTrade service, not the Hermes model container; it owns DB/broker access
  # and derives every job's user_id from the API's validated delegation.
  hermes-jobs:
    build:
      context: .
      dockerfile: Dockerfile.agui
    command: ["python", "-m", "engine.agents.hermes_jobs"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_SIZE=${HERMES_JOBS_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${HERMES_JOBS_DB_MAX_OVERFLOW:-1}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-5}
      - DB_APPLICATION_NAME=alpatrade-hermes-jobs
      - HERMES_JOBS_POLL_SECONDS=${HERMES_JOBS_POLL_SECONDS:-2}
      - ALPACA_PAPER_API_KEY=${ALPACA_PAPER_API_KEY}
      - ALPACA_PAPER_SECRET_KEY=${ALPACA_PAPER_SECRET_KEY}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-yfinance}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - EODHD_API_KEY=${EODHD_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY:-}
      - TO_EMAIL=${TO_EMAIL:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'engine.agents.hermes_jobs' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Merged single FastHTML app (landing + auth + chat + guide + voice).
  # Serves BOTH alpatrade.chat and alpatrade.dev via `python main.py` on port 5003.
  # (The legacy `web` service running web_app.py has been retired.)
  agui:
    build:
      context: .
      dockerfile: Dockerfile.agui
    ports:
      - "9003:5003"
    environment:
      - ASSETHERO_WEB_PORT=5003
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-3}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-2}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-5}
      - DB_APPLICATION_NAME=alpatrade-web
      - API_URL=https://api.alpatrade.chat
      - ALPACA_PAPER_API_KEY=${ALPACA_PAPER_API_KEY}
      - ALPACA_PAPER_SECRET_KEY=${ALPACA_PAPER_SECRET_KEY}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-yfinance}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - EODHD_API_KEY=${EODHD_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - API_SERVICE_KEY=${API_SERVICE_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - HERMES_API_URL=http://hermes:8642/v1
      - HERMES_API_SERVER_KEY=${HERMES_API_SERVER_KEY:-}
      - HERMES_API_MODEL=${HERMES_API_MODEL:-hermes-agent}
      - PNL_REPORT_FREQUENCY=${PNL_REPORT_FREQUENCY:-daily}
      - PNL_REPORT_HOUR_UTC=${PNL_REPORT_HOUR_UTC:-21}
      - PNL_REPORT_TO=${PNL_REPORT_TO:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5003/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Autonomous agent-team worker (Phase C). Paper-only. Runs in prod alongside
  # paper-strategy; the loop itself is gated by AUTONOMY_ENABLED (default true).
  # Set AUTONOMY_ENABLED=false or scale the service to 0 in Coolify to stop it.
  autonomy:
    build:
      context: .
      dockerfile: Dockerfile.agui
    command: ["python", "-m", "engine.autonomy.worker"]
    environment:
      - AUTONOMY_ENABLED=${AUTONOMY_ENABLED:-true}
      - AUTONOMY_SCAN_SECONDS=${AUTONOMY_SCAN_SECONDS:-300}
      - AUTONOMY_STRATEGY=${AUTONOMY_STRATEGY:-btd}
      - AUTONOMY_HEARTBEAT_SECONDS=${AUTONOMY_HEARTBEAT_SECONDS:-30}
      - PNL_REPORT_FREQUENCY=${PNL_REPORT_FREQUENCY:-daily}
      - PNL_REPORT_HOUR_UTC=${PNL_REPORT_HOUR_UTC:-21}
      - PNL_REPORT_TO=${PNL_REPORT_TO:-}
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_SIZE=${AUTONOMY_DB_POOL_SIZE:-1}
      - DB_MAX_OVERFLOW=${AUTONOMY_DB_MAX_OVERFLOW:-1}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-5}
      - DB_APPLICATION_NAME=alpatrade-autonomy
      - ALPACA_PAPER_API_KEY=${ALPACA_PAPER_API_KEY}
      - ALPACA_PAPER_SECRET_KEY=${ALPACA_PAPER_SECRET_KEY}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-yfinance}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY:-}
      - TO_EMAIL=${TO_EMAIL:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'engine.autonomy.worker' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Observe a FIXED strategy in the wild — paper-trades the validated PDT-safe swing
  # (buy 7% dips / TP 6% / SL 10% / hold 3-20d) on the paper account, and fires the
  # nightly PnL report. Runs in prod (paper only — no real money). Stop it by setting
  # PAPER_DURATION_SECONDS=0 or scaling the service to 0 in Coolify.
  paper-strategy:
    build:
      context: .
      dockerfile: Dockerfile.agui
    command: ["python", "scripts/run_paper_strategy.py"]
    environment:
      - PAPER_DIP=${PAPER_DIP:-7}
      - PAPER_TP=${PAPER_TP:-6}
      - PAPER_SL=${PAPER_SL:-10}
      - PAPER_HOLD=${PAPER_HOLD:-20}
      - PAPER_MIN_HOLD=${PAPER_MIN_HOLD:-3}
      - PAPER_CAPITAL_PER_TRADE=${PAPER_CAPITAL_PER_TRADE:-1000}
      - PAPER_SYMBOLS=${PAPER_SYMBOLS:-AAPL,MSFT,GOOGL,AMZN,META,TSLA,NVDA}
      - PAPER_DURATION_SECONDS=${PAPER_DURATION_SECONDS:-604800}
      - PAPER_POLL_SECONDS=${PAPER_POLL_SECONDS:-300}
      - PNL_REPORT_FREQUENCY=${PNL_REPORT_FREQUENCY:-daily}
      - PNL_REPORT_HOUR_UTC=${PNL_REPORT_HOUR_UTC:-21}
      - PNL_REPORT_TO=${PNL_REPORT_TO:-}
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_SIZE=${PAPER_DB_POOL_SIZE:-1}
      - DB_MAX_OVERFLOW=${PAPER_DB_MAX_OVERFLOW:-1}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-5}
      - DB_APPLICATION_NAME=alpatrade-paper
      - ALPACA_PAPER_API_KEY=${ALPACA_PAPER_API_KEY}
      - ALPACA_PAPER_SECRET_KEY=${ALPACA_PAPER_SECRET_KEY}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-yfinance}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'run_paper_strategy.py' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  hermes-data:
