services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "9001:5001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-3}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-2}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-5}
      - DB_APPLICATION_NAME=alpatrade-api
      - ALPACA_PAPER_API_KEY=${ALPACA_PAPER_API_KEY}
      - ALPACA_PAPER_SECRET_KEY=${ALPACA_PAPER_SECRET_KEY}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-yfinance}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - EODHD_API_KEY=${EODHD_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - API_SERVICE_KEY=${API_SERVICE_KEY:-}
      - API_SERVICE_KEYS=${API_SERVICE_KEYS:-}
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY:-}
      - TO_EMAIL=${TO_EMAIL:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Merged single FastHTML app (landing + auth + chat + guide + voice).
  # Serves BOTH alpatrade.chat and alpatrade.dev via `python main.py` on port 5003.
  # (The legacy `web` service running web_app.py has been retired.)
  agui:
    build:
      context: .
      dockerfile: Dockerfile.agui
    ports:
      - "9003:5003"
    environment:
      - ASSETHERO_WEB_PORT=5003
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-3}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-2}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-5}
      - DB_APPLICATION_NAME=alpatrade-web
      - API_URL=https://api.alpatrade.chat
      - ALPACA_PAPER_API_KEY=${ALPACA_PAPER_API_KEY}
      - ALPACA_PAPER_SECRET_KEY=${ALPACA_PAPER_SECRET_KEY}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-yfinance}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - EODHD_API_KEY=${EODHD_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - API_SERVICE_KEY=${API_SERVICE_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5003/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Autonomous agent-team worker (Phase C). Paper-only. Runs in prod alongside
  # paper-strategy; full autonomy is gated by AUTONOMY_ENABLED (default true),
  # while ADVISOR_ENABLED separately controls the post-close advisor scheduler.
  autonomy:
    build:
      context: .
      dockerfile: Dockerfile.agui
    command: ["python", "-m", "engine.autonomy.worker"]
    environment:
      - AUTONOMY_ENABLED=${AUTONOMY_ENABLED:-true}
      - AUTONOMY_SCAN_SECONDS=${AUTONOMY_SCAN_SECONDS:-300}
      - AUTONOMY_STRATEGY=${AUTONOMY_STRATEGY:-btd}
      - AUTONOMY_HEARTBEAT_SECONDS=${AUTONOMY_HEARTBEAT_SECONDS:-30}
      - ADVISOR_ENABLED=${ADVISOR_ENABLED:-true}
      - ADVISOR_EMAIL_ENABLED=${ADVISOR_EMAIL_ENABLED:-false}
      - ADVISOR_CLOSE_DELAY_MINUTES=${ADVISOR_CLOSE_DELAY_MINUTES:-15}
      - ADVISOR_SCHEDULER_POLL_SECONDS=${ADVISOR_SCHEDULER_POLL_SECONDS:-60}
      - ADVISOR_WORKER_POLL_SECONDS=${ADVISOR_WORKER_POLL_SECONDS:-10}
      - ADVISOR_MIN_CLOSED_TRADES=${ADVISOR_MIN_CLOSED_TRADES:-5}
      - ADVISOR_DRIFT_RATIO=${ADVISOR_DRIFT_RATIO:-0.5}
      - ADVISOR_LOSING_SESSIONS=${ADVISOR_LOSING_SESSIONS:-3}
      - ADVISOR_DRAWDOWN_PCT=${ADVISOR_DRAWDOWN_PCT:-5}
      - ADVISOR_URGENT_DAILY_LOSS_PCT=${ADVISOR_URGENT_DAILY_LOSS_PCT:-2}
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_SIZE=${AUTONOMY_DB_POOL_SIZE:-1}
      - DB_MAX_OVERFLOW=${AUTONOMY_DB_MAX_OVERFLOW:-1}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-5}
      - DB_APPLICATION_NAME=alpatrade-autonomy
      - ALPACA_PAPER_API_KEY=${ALPACA_PAPER_API_KEY}
      - ALPACA_PAPER_SECRET_KEY=${ALPACA_PAPER_SECRET_KEY}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-yfinance}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY:-}
      - TO_EMAIL=${TO_EMAIL:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'engine.autonomy.worker' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Observe a FIXED strategy in the wild — paper-trades the validated PDT-safe swing
  # (buy 7% dips / TP 6% / SL 10% / hold 3-20d) on the paper account. The autonomy
  # worker owns post-close advisor reporting. Stop this strategy by setting
  # PAPER_DURATION_SECONDS=0 or scaling the service to 0 in Coolify.
  paper-strategy:
    build:
      context: .
      dockerfile: Dockerfile.agui
    command: ["python", "scripts/run_paper_strategy.py"]
    environment:
      - PAPER_DIP=${PAPER_DIP:-7}
      - PAPER_TP=${PAPER_TP:-6}
      - PAPER_SL=${PAPER_SL:-10}
      - PAPER_HOLD=${PAPER_HOLD:-20}
      - PAPER_MIN_HOLD=${PAPER_MIN_HOLD:-3}
      - PAPER_SOURCE_LOOKBACK=${PAPER_SOURCE_LOOKBACK:-1y}
      - PAPER_USER_ID=${PAPER_USER_ID:-}
      - PAPER_ACCOUNT_ID=${PAPER_ACCOUNT_ID:-}
      - PAPER_CAPITAL_PER_TRADE=${PAPER_CAPITAL_PER_TRADE:-1000}
      - PAPER_SYMBOLS=${PAPER_SYMBOLS:-AAPL,MSFT,GOOGL,AMZN,META,TSLA,NVDA}
      - PAPER_DURATION_SECONDS=${PAPER_DURATION_SECONDS:-604800}
      - PAPER_POLL_SECONDS=${PAPER_POLL_SECONDS:-300}
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_SIZE=${PAPER_DB_POOL_SIZE:-1}
      - DB_MAX_OVERFLOW=${PAPER_DB_MAX_OVERFLOW:-1}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-5}
      - DB_APPLICATION_NAME=alpatrade-paper
      - ALPACA_PAPER_API_KEY=${ALPACA_PAPER_API_KEY}
      - ALPACA_PAPER_SECRET_KEY=${ALPACA_PAPER_SECRET_KEY}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-yfinance}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'run_paper_strategy.py' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
