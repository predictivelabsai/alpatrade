name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite hits live Alpaca/DB. A socket with no timeout once hung the job for
    # 15+ minutes; without a cap it would sit on a runner for hours and, now that
    # deploys gate on CI, silently block CD.
    timeout-minutes: 20
    # `secrets` is not available in a step-level `if`, but it is here. Resolve the
    # presence check once, at job level, so the gate below can read it via `env`.
    env:
      HAS_DB_SECRET: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install authlib pytest pytest-asyncio

      - name: Byte-compile (syntax check)
        run: python -m compileall -q app.py api.py engine verticals tui utils agents

      - name: Import smoke test
        env:
          XAI_API_KEY: ci-import-placeholder
        run: |
          python -c "import app; print('app import OK')"
          python -c "from engine.web import landing, layout; print('shell import OK')"

      - name: Unit tests
        timeout-minutes: 5
        env:
          XAI_API_KEY: ci-import-placeholder
        run: python -m pytest tests/test_alpha_research.py tests/test_index_options.py tests/test_ui_navigation.py tests/test_premarket.py tests/test_research.py tests/test_chat_chart_transport.py tests/test_chat_persistence.py tests/test_objective.py tests/test_refit.py tests/test_regime.py tests/test_vol_sizing.py tests/test_promotion.py tests/test_short_exits.py tests/test_agent_framework_default.py tests/test_hermes_runtime.py tests/test_hermes_access.py tests/test_hermes_jobs.py tests/test_hermes_backtest_quality.py tests/test_scout_reasoning.py tests/test_backtest_reasoning.py tests/test_mobile_api_contract.py tests/test_deepagents_api.py tests/test_chat_routing.py tests/test_chat_alpaca_keys.py tests/test_news_panel.py tests/test_daily_advisor.py tests/test_pnl_dashboard.py tests/test_autonomy_worker.py tests/test_run_recovery.py tests/test_daily_pnl_tenant_report.py tests/test_email_util.py tests/test_report_analytics.py tests/test_voice_alpaca_keys.py tests/test_state_isolation.py -q

      # DB-backed regression suite (opt-in): runs only when the DATABASE_URL secret
      # is configured on the repo. Add it with:  gh secret set DATABASE_URL
      - name: Regression suite (if DB secret present)
        if: ${{ env.HAS_DB_SECRET == 'true' }}
        timeout-minutes: 10
        env:
          # The AG-UI tests only need an OpenAI-compatible client to *construct*, so a
          # placeholder is enough and no real key goes near CI. Deliberately NOT
          # XAI_API_KEY: TestAgentRuntime.test_build_and_run_langgraph skips while that
          # is unset but makes a real LLM call once it is set, so a placeholder there
          # would turn a clean skip into a failure.
          OPENAI_API_KEY: ci-import-placeholder
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: python -m pytest tests/regression_suite.py -q
