name: Deploy (Coolify)

# Redeploys the prod app on Coolify after CI succeeds on main.
#
# Required repo secrets (same names as .env, so `gh secret set X < <(...)` is easy):
#   COOLIFY_URL        e.g. https://coolify.example.tld
#   COOLIFY_API_TOKEN  API token with root permission (Coolify 4.1.2 requires it
#                      to read deployment status after triggering a deploy)
#   COOLIFY_APP_UUID   uuid from `python scripts/coolify_deploy.py list`
#
# If those are missing this workflow FAILS rather than skipping. An earlier version
# exited 0 when unconfigured, so every run showed a green check while deploying
# nothing — pushes to main silently never shipped. A red X is the point.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force a no-cache rebuild (default). Set false for a fast, cache-reusing deploy."
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      - name: Check deploy credentials
        run: |
          missing=""
          [ -n "$COOLIFY_URL" ]       || missing="$missing COOLIFY_URL"
          [ -n "$COOLIFY_API_TOKEN" ] || missing="$missing COOLIFY_API_TOKEN"
          [ -n "$COOLIFY_APP_UUID" ]  || missing="$missing COOLIFY_APP_UUID"
          if [ -n "$missing" ]; then
            echo "::error::CD not configured — missing secret(s):$missing. Add them with 'gh secret set <NAME>'."
            exit 1
          fi

      - name: Trigger Coolify deploy
        id: trigger
        run: |
          # Force a no-cache rebuild by default. A cache-reusing deploy (force=false)
          # was silently serving STALE images: after a Compose upgrade, service
          # images stopped picking up source changes, so the api service sat several
          # versions behind while reporting a newer version string. workflow_run
          # events carry no inputs, so default to force=true there; manual dispatch
          # may override to false for a fast deploy.
          FORCE="${{ github.event.inputs.force }}"
          [ "$FORCE" = "false" ] || FORCE="true"
          echo "Deploying with force=$FORCE"
          # Coolify's deploy trigger used to be GET /api/v1/deploy, but a server
          # upgrade (~2026-08-18) started returning 405 to GET; it now expects POST
          # with a JSON body. Try GET first for older instances, then fall back to
          # POST — the same fallback scripts/coolify_deploy.py already uses.
          resp=$(curl -fsSL -X GET \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=${FORCE}") \
          || resp=$(curl -fsSL -X POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\":\"${COOLIFY_APP_UUID}\",\"force\":${FORCE}}" \
            "${COOLIFY_URL%/}/api/v1/deploy")
          echo "$resp"
          uuid=$(printf '%s' "$resp" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$uuid" ]; then
            echo "::error::Coolify accepted the request but returned no deployment uuid."
            exit 1
          fi
          echo "deployment_uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "Queued deployment $uuid"

      - name: Wait for the deployment to finish
        run: |
          # Without pipefail, a failed curl (for example a 403 from an
          # under-permissioned token) is hidden by jq and this loop waits 20m.
          set -o pipefail
          uuid="${{ steps.trigger.outputs.deployment_uuid }}"
          for i in $(seq 1 80); do
            status=$(curl -fsSL -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "${COOLIFY_URL%/}/api/v1/deployments/$uuid" | jq -r '.status // "unknown"')
            echo "[$((i * 15))s] $status"
            case "$status" in
              finished)
                echo "Deployment finished."
                exit 0 ;;
              failed|error|cancelled-by-user)
                echo "::error::Deployment ended with status: $status"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out after 20m waiting for deployment $uuid"
          exit 1

      - name: Smoke-test prod
        run: |
          # Coolify reports "finished" before the new container is actually serving, so
          # the first requests get a 302 from the proxy mid-swap. curl --retry does not
          # retry a 302 (it is a valid response), which failed an otherwise good deploy.
          # Poll for a real 200 instead of trusting the first answer.
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://alpatrade.chat/ || echo 000)
            echo "[$((i * 10))s] GET / -> $code"
            if [ "$code" = "200" ]; then
              echo "Prod is serving."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Prod never returned 200 within 4m after deploy (last: $code)"
          exit 1
