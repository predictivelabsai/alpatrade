name: carhero
description: AI-powered European premium car marketplace
version: 1.0.6+7
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2-dev.2
  riverpod_annotation: ^4.0.3-dev.2

  # Routing
  go_router: ^17.3.0

  # Networking
  dio: ^5.7.0
  http: ^1.3.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.7

  # UI
  fl_chart: ^1.2.0
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_markdown: any
  url_launcher: ^6.3.1
  share_plus: ^13.1.0

  # Data
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: any

  # Auth
  google_sign_in: ^7.2.0

  # Utilities
  collection: any
  equatable: ^2.0.7
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.9.4
  riverpod_generator: ^4.0.4-dev.3
  mockito: ^5.4.6
  flutter_launcher_icons: ^0.14.3
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

